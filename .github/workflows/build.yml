name: build

# The authoritative build/test environment for this project. The development
# container's network policy blocks opam package downloads (see ADR-0005), so
# CI — not a developer machine — is where OCaml correctness is established.
# Every RTL and DV work order is verified here before its gate signature.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Build
        run: opam exec -- dune build @default

      - name: Run tests (expect tests, waveform snapshots)
        # An expect-test diff is a promotion source exactly like an RTL
        # snapshot (ADR-0005 rule 2), and it dies at this step — before the
        # determinism step's block can print it. So failure prints the same
        # sha256+base64 block over every .corrected file dune produced.
        run: |
          opam exec -- dune runtest || {
            echo '=== PROMOTION BLOCK (expect tests): sha256 + base64 -w 400 of every .corrected under _build ==='
            find _build -name '*.corrected' | sort | while read -r f; do
              echo "--- FILE $f"
              sha256sum "$f"
              base64 -w 400 "$f"
              echo "--- END $f"
            done
            echo '=== END PROMOTION BLOCK ==='
            exit 1
          }

      - name: Generate RTL
        run: opam exec -- dune exec bin/generate.exe

      - name: Verify nothing was left unpromoted or non-deterministic
        # Catches three distinct failures with one check:
        #  * an expect test whose output changed but was never promoted
        #  * RTL generation that is not byte-reproducible (rtl_snapshots drift)
        #  * a generated file that was never committed (plain `git diff`
        #    ignores untracked files, so stage everything first)
        # On failure the printed diff IS the promotion source (ADR-0005).
        # The diff alone is not retrievable when it outgrows the log-fetch
        # window, so failure also prints a compact PROMOTION BLOCK: sha256 +
        # base64 of every staged path, always within reach of the log tail.
        # The checksum makes the promotion byte-verifiable at apply time.
        run: |
          git add -A
          git diff --cached --exit-code || {
            echo '=== PROMOTION BLOCK: sha256 + base64 -w 400 of every staged path ==='
            git diff --cached --name-only | while read -r f; do
              if [ -f "$f" ]; then
                echo "--- FILE $f"
                sha256sum "$f"
                base64 -w 400 "$f"
                echo "--- END $f"
              else
                echo "--- DELETED $f"
              fi
            done
            echo '=== END PROMOTION BLOCK ==='
            exit 1
          }
      - name: DV mechanical checks (C-9 record-vs-appendix, X-9 emitted Verilog)
        run: tools/dv_checks.sh

      - name: Abort-bit availability quantifier (C-37/ADR-0012, 8.7M pairs)
        run: tools/check_abort_availability.sh


