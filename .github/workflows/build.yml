name: build

# The authoritative build/test environment for this project. The development
# container's network policy blocks opam package downloads (see ADR-0005), so
# CI — not a developer machine — is where OCaml correctness is established.
# Every RTL and DV work order is verified here before its gate signature.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Build
        run: opam exec -- dune build @default

      - name: Run tests (expect tests, waveform snapshots)
        # An expect-test diff is a promotion source exactly like an RTL
        # snapshot (ADR-0005 rule 2), and it dies at this step — before the
        # determinism step's block can print it. So failure prints the same
        # sha256+base64 block over every .corrected file dune produced.
        # dune keeps corrections in its own promotion staging, not as
        # .corrected files under _build/default (run 30760906636 printed an
        # empty block). So: let `dune promote` apply them to the checkout,
        # then print the promoted sources themselves — dune's own promotion
        # logic does the path mapping, the block just ships the bytes.
        run: |
          opam exec -- dune runtest || {
            opam exec -- dune promote || true
            echo '=== PROMOTION BLOCK (expect tests): sha256 + base64 -w 400 of every promoted source ==='
            git diff --name-only | while read -r f; do
              echo "--- FILE $f"
              sha256sum "$f"
              base64 -w 400 "$f"
              echo "--- END $f"
            done
            echo '=== END PROMOTION BLOCK ==='
            exit 1
          }

      - name: Generate RTL
        run: opam exec -- dune exec bin/generate.exe

      - name: Verify nothing was left unpromoted or non-deterministic
        # Catches three distinct failures with one check:
        #  * an expect test whose output changed but was never promoted
        #  * RTL generation that is not byte-reproducible (rtl_snapshots drift)
        #  * a generated file that was never committed (plain `git diff`
        #    ignores untracked files, so stage everything first)
        # On failure the printed diff IS the promotion source (ADR-0005).
        # The diff alone is not retrievable when it outgrows the log-fetch
        # window, so failure also prints a compact PROMOTION BLOCK: sha256 +
        # base64 of every staged path, always within reach of the log tail.
        # The checksum makes the promotion byte-verifiable at apply time.
        run: |
          git add -A
          git diff --cached --exit-code || {
            echo '=== PROMOTION BLOCK: sha256 + base64 -w 400 of every staged path ==='
            git diff --cached --name-only | while read -r f; do
              if [ -f "$f" ]; then
                echo "--- FILE $f"
                sha256sum "$f"
                base64 -w 400 "$f"
                echo "--- END $f"
              else
                echo "--- DELETED $f"
              fi
            done
            echo '=== END PROMOTION BLOCK ==='
            exit 1
          }
      - name: DV mechanical checks (C-9 record-vs-appendix, X-9 emitted Verilog)
        run: tools/dv_checks.sh

      - name: Abort-bit availability quantifier (C-37/ADR-0012, 8.7M pairs)
        run: tools/check_abort_availability.sh

  # The differential co-simulation lane (ADR-0015, WO-0046 Phase 1).
  # Its own job, not a step in `build` (R-CI-1): a cosim failure must be
  # attributable to the lane, and the main suite must not wait on iverilog.
  cosim:
    runs-on: ubuntu-latest
    # R-CI-4: the first-landing continue-on-error came off here, per its own
    # written condition, after run 30830553582 (991bb0c) executed all three
    # checks green — differential agreement, the deliberate-mismatch check
    # proving the comparator can fail, and two-run byte determinism. From
    # this commit on, a cosim failure fails the build.
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      # ADR-0015 D1: Icarus from the Ubuntu archive, no PPA, no source build
      # (R-CI-2). A failed install fails the job — never a silent skip.
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # One entry point (WO-0046 §4): exit 0 = differential compare +
      # mismatch self-test + two-run determinism all passed; nonzero names
      # the failing check. Simulator versions go into the .canon.meta
      # sidecars (R-CI-3) written by the script itself; all simulation
      # artifacts live in mktemp space outside the checkout (R-CI-5) and are
      # removed on every exit path — failure evidence is cat to the log
      # before cleanup (script §7.3), which is where R-CI-6's diagnostic
      # burden is discharged: an upload step would race the script's own
      # hygiene rule, and the log copy is the promotion-block precedent.
      - name: Run the co-simulation lane (WO-0046 Phase 1)
        run: opam exec -- tools/cosim/run_cosim.sh


